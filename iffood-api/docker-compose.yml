services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iffood-api
    restart: unless-stopped
    ports:
      - "${PORT:-3006}:3006"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      # SQS: defina SQS_QUEUE_URL (e, se for LocalStack, SQS_ENDPOINT) no ficheiro .env.
      # Não fixar aqui — em produção use a URL https://sqs.REGION.amazonaws.com/...; com LocalStack use host.docker.internal no .env.
    extra_hosts:
      # Linux (Docker 20.10+): permite resolver host.docker.internal → bridge do host
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - iffood-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3006/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: iffood-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - iffood-net
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:

networks:
  iffood-net:
    driver: bridge
